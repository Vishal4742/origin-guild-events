name: Update events from Luma
on:
  schedule:
    - cron: "0 3 */3 * *"   # every 3 days, 08:30 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_events.py
      - run: |
          git config user.name "events-bot"
          git config user.email "actions@github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Update events from Luma" && git push)
