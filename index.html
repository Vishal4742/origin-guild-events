<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origin Guild Events</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: one column. Site preview card, then the event list, next event as the hero. */
  :root {
    --bg: #f4f3ec; --paper: #fffdf7; --ink: #17201f; --ink-2: #5b6563; --line: #dcdbd0;
    --marigold: #e9a21a; --petrol: #1f5f5b; --petrol-soft: #e1ecea;
    --display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    --body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121716; --paper: #1a2120; --ink: #f1f0e8; --ink-2: #a3aca9; --line: #2c3634;
            --marigold: #f0b23a; --petrol: #7fc4bd; --petrol-soft: #1d2f2d; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--petrol); outline-offset: 3px; }
  .wrap { max-width: 760px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
  .brand { font-family: var(--display); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; }
  .brand small { font-family: var(--mono); font-weight: 500; font-size: 0.72rem; color: var(--ink-2); margin-left: 10px; letter-spacing: 0.04em; }

  /* Site preview */
  .site { display: block; margin-top: 28px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--paper); text-decoration: none; box-shadow: 0 24px 50px -32px rgba(23,32,31,.4); }
  .site img { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 630; object-fit: cover; }
  .site .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--line); }
  .site .bar b { font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
  .site .bar span { font-family: var(--mono); font-size: 0.78rem; color: var(--petrol); white-space: nowrap; }

  /* Events */
  h2 { font-family: var(--display); font-weight: 700; font-size: 1.05rem; margin: 40px 0 14px; }
  .events { display: grid; gap: 16px; list-style: none; padding: 0; margin: 0; }
  .event { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 18px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .event.hero { grid-template-columns: 220px minmax(0, 1fr); border-color: var(--petrol); }
  @media (max-width: 560px) { .event, .event.hero { grid-template-columns: 1fr; } .cover { max-width: 240px; } }
  .cover { aspect-ratio: 1; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--petrol-soft); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .meta { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .chip { align-self: flex-start; font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--petrol); color: #fffdf7; }
  .chip.live { background: var(--marigold); color: #17201f; }
  h3 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
  .hero h3 { font-size: clamp(1.4rem, 2.4vw, 1.75rem); }
  .when { font-family: var(--mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .when span { color: var(--ink-2); }
  .where { font-size: 0.85rem; color: var(--ink-2); }
  .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-top: 4px; }
  .btn { display: inline-block; text-decoration: none; background: var(--ink); color: var(--bg); font: 600 0.85rem var(--body); padding: 9px 16px; border-radius: 10px; }
  .countdown { font-family: var(--mono); font-size: 0.78rem; color: var(--petrol); }
  .empty { color: var(--ink-2); font-size: 0.9rem; padding: 24px; border: 1px dashed var(--line); border-radius: 14px; }
  footer { margin-top: 40px; font-size: 0.78rem; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">The Origin Guild <small>BHOPAL · MP</small></div>
  </header>

  <a class="site" href="https://www.withclaude.in/" target="_blank" rel="noopener">
    <img src="withclaude.jpg" alt="With Claude: India's community for people building with Claude">
    <div class="bar"><b>With Claude · India's Claude community</b><span>withclaude.in ↗</span></div>
  </a>

  <h2>Upcoming</h2>
  <ul class="events" id="upcoming"></ul>

  <footer>Times in IST. Venue details are shared on Luma after registration.</footer>
</div>

<script id="luma-checkout" src="https://embed.lu.ma/checkout-button.js"></script>
<script>
  var IST = { timeZone: "Asia/Kolkata" };
  function fmt(d, o) { return new Intl.DateTimeFormat("en-IN", Object.assign({}, IST, o)).format(d); }
  function when(ev) {
    var s = new Date(ev.start), e = new Date(ev.end);
    var day = fmt(s, { weekday: "short", day: "numeric", month: "short" });
    var t = fmt(s, { hour: "numeric", minute: "2-digit" });
    if (fmt(s, { dateStyle: "medium" }) === fmt(e, { dateStyle: "medium" })) return day + " <span>·</span> " + t + "–" + fmt(e, { hour: "numeric", minute: "2-digit" });
    return day + " → " + fmt(e, { weekday: "short", day: "numeric", month: "short" }) + " <span>·</span> " + t + " start";
  }
  function countdown(ev, now) {
    var days = Math.ceil((new Date(ev.start) - now) / 864e5);
    return days <= 0 ? "Today" : days === 1 ? "Tomorrow" : "In " + days + " days";
  }
  function card(ev, i, now) {
    var live = now >= new Date(ev.start);
    return '<li class="event' + (i === 0 ? " hero" : "") + '">'
      + '<div class="cover"><img src="' + ev.cover + '" alt="" referrerpolicy="no-referrer"></div>'
      + '<div class="meta">'
      + (live ? '<span class="chip live">Happening now</span>' : i === 0 ? '<span class="chip">Next up</span>' : "")
      + '<h3>' + ev.title + '</h3>'
      + '<div class="when">' + when(ev) + '</div>'
      + '<div class="where">📍 ' + ev.where + '</div>'
      + '<div class="actions"><a class="btn luma-checkout--button" href="https://luma.com/event/' + ev.evt + '" data-luma-action="checkout" data-luma-event-id="' + ev.evt + '">Register →</a>'
      + '<span class="countdown">' + (live ? "Live now" : countdown(ev, now)) + '</span></div>'
      + '</div></li>';
  }
  fetch("events.json?" + Date.now()).then(function (r) { return r.json(); }).then(function (list) {
    var now = new Date();
    var up = list.filter(function (e) { return now <= new Date(e.end); }).sort(function (a, b) { return new Date(a.start) - new Date(b.start); });
    document.getElementById("upcoming").innerHTML = up.length ? up.map(function (e, i) { return card(e, i, now); }).join("")
      : '<li class="empty">Nothing scheduled right now. Check back soon.</li>';
  });
</script>
</body>
</html>
